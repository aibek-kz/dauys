<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дауыс беру</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a66;
    --accent: #2f7d6d; --accent-soft: #d8eee8; --border: #e3e0d8;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161715; --card: #212320; --text: #f0eee8; --muted: #a09e97;
      --accent: #5fc2ac; --accent-soft: #23423b; --border: #34372f;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 520px; margin: 0 auto; padding: 28px 18px 40px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 22px; font-size: .95rem; }
  .opt {
    position: relative; overflow: hidden; width: 100%;
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px; margin-bottom: 10px; text-align: left;
    background: var(--card); color: var(--text);
    border: 1.5px solid var(--border); border-radius: 14px;
    font-size: 1.05rem; font-family: inherit; cursor: pointer;
  }
  .opt:disabled { cursor: default; }
  .opt.mine { border-color: var(--accent); }
  .bar {
    position: absolute; inset: 0 auto 0 0; width: 0%;
    background: var(--accent-soft); transition: width .4s ease; z-index: 0;
  }
  .opt span { position: relative; z-index: 1; }
  .pct { color: var(--muted); font-size: .9rem; white-space: nowrap; margin-left: 12px; }
  .mine .pct { color: var(--accent); font-weight: 600; }
  .total { margin-top: 14px; color: var(--muted); font-size: .9rem; }
  .note {
    margin-top: 16px; padding: 12px 14px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--muted); font-size: .9rem; display: none;
  }
</style>
</head>
<body>
<main>
  <h1>Сіздің дініңіз қандай?</h1>
  <p class="sub">Бір дауыс беріңіз. Дауысты кейін өзгертуге болады.</p>
  <div id="options"></div>
  <div class="total" id="total"></div>
  <div class="note" id="note"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// 1-ҚАДАМ: Firebase консолінен алған мәндеріңізді осында қойыңыз
// (Project settings → Your apps → Web app → firebaseConfig)
var firebaseConfig = {
  apiKey: "ОСЫНДА_ҚОЙЫҢЫЗ",
  authDomain: "ОСЫНДА_ҚОЙЫҢЫЗ",
  projectId: "ОСЫНДА_ҚОЙЫҢЫЗ",
  appId: "ОСЫНДА_ҚОЙЫҢЫЗ"
};

(function () {
  var OPTIONS = [
    { id: "islam",    label: "Ислам" },
    { id: "hristian", label: "Христиан" },
    { id: "hindu",    label: "Индуизм" },
    { id: "budda",    label: "Буддизм" },
    { id: "iudaizm",  label: "Иудаизм" },
    { id: "ateist",   label: "Атеист" },
    { id: "basqa",    label: "Басқа" }
  ];
  var counts = {}, myChoice = null, canVote = false, voting = false;
  var db = null, myId = null;

  var box = document.getElementById("options");
  var totalEl = document.getElementById("total");
  var noteEl = document.getElementById("note");

  function showNote(t) { noteEl.textContent = t; noteEl.style.display = "block"; }

  function render() {
    var total = 0;
    OPTIONS.forEach(function (o) { total += counts[o.id] || 0; });
    box.innerHTML = "";
    OPTIONS.forEach(function (o) {
      var n = counts[o.id] || 0;
      var pct = total ? Math.round(n * 100 / total) : 0;
      var b = document.createElement("button");
      b.className = "opt" + (myChoice === o.id ? " mine" : "");
      b.disabled = !canVote || voting;
      var bar = document.createElement("div");
      bar.className = "bar"; bar.style.width = pct + "%";
      var l = document.createElement("span"); l.textContent = o.label;
      var p = document.createElement("span");
      p.className = "pct"; p.textContent = n + " · " + pct + "%";
      b.appendChild(bar); b.appendChild(l); b.appendChild(p);
      b.addEventListener("click", function () { vote(o.id); });
      box.appendChild(b);
    });
    totalEl.textContent = "Барлығы: " + total + " дауыс";
  }

  function vote(id) {
    if (!canVote || !db || !myId || voting) return;
    voting = true; render();
    db.collection("votes").doc(myId).set({ choice: id }).then(function () {
      voting = false; render();
    }).catch(function () {
      voting = false;
      showNote("Дауыс беру мүмкін болмады. Кейінірек қайталап көріңіз.");
      render();
    });
  }

  render();

  if (firebaseConfig.apiKey.indexOf("ОСЫНДА") === 0) {
    showNote("Firebase баптауы әлі енгізілмеген. Файлдың жоғарғы жағындағы firebaseConfig мәндерін толтырыңыз.");
    return;
  }

  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firebase.auth().signInAnonymously().then(function (cred) {
      myId = cred.user.uid;
      canVote = true;
      render();
    }).catch(function () {
      showNote("Жүйеге кіру мүмкін болмады. Нәтижені көре аласыз, бірақ дауыс бере алмайсыз.");
    });

    db.collection("votes").onSnapshot(function (snap) {
      counts = {}; myChoice = null;
      snap.forEach(function (d) {
        var data = d.data();
        if (!data || !data.choice) return;
        counts[data.choice] = (counts[data.choice] || 0) + 1;
        if (myId && d.id === myId) myChoice = data.choice;
      });
      render();
    }, function () { showNote("Нәтижені жүктеу мүмкін болмады."); });
  } catch (e) {
    showNote("Firebase іске қосылмады. Баптауды тексеріңіз.");
  }
})();
</script>
</body>
  </html>
